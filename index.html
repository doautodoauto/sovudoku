#board{position:relative;touch-action:none;cursor:pointer;border-radius:3px}
#cells{position:absolute;inset:0;display:grid;border-radius:3px;overflow:hidden}
.cell{position:relative;background-color:var(--c);background-image:radial-gradient(130% 130% at 28% 18%,rgba(255,244,210,.28),rgba(255,244,210,0) 55%,rgba(0,0,0,.24) 100%),var(--noise);background-size:100% 100%,90px 90px;box-shadow:inset 0 0 0 .5px rgba(0,0,0,.38),inset 0 0 0 1px rgba(255,240,200,.07);transition:filter .3s}
.cell.claim{animation:claim 1.1s ease-out}
@keyframes claim{30%{filter:brightness(1.5) saturate(1.25)}}
.cell svg.x{position:absolute;left:22%;top:22%;width:56%;height:56%;animation:xin .22s ease-out}
@keyframes xin{from{transform:scale(.3) rotate(-30deg);opacity:0}}
.cell.foc::after{content:"";position:absolute;inset:2px;border-radius:4px;box-shadow:inset 0 0 0 2px #fff0b0,0 0 14px #ffd36a;animation:foc .8s ease-in-out infinite alternate;z-index:1}
@keyframes foc{from{opacity:.4}to{opacity:1}}
.cell.tgt::after{content:"";position:absolute;inset:6%;border-radius:50%;background:radial-gradient(circle,rgba(255,250,220,.95),rgba(255,210,110,.5) 45%,rgba(255,200,90,0) 70%);animation:foc .6s ease-in-out infinite alternate;z-index:1}
.cell.conf::after{content:"";position:absolute;inset:1px;border-radius:3px;box-shadow:inset 0 0 0 2px #ff6b5a,0 0 12px #ff3b2a;animation:foc .4s ease-in-out 5 alternate;z-index:1}
svg#borders{position:absolute;inset:0;pointer-events:none;overflow:visible;z-index:2}
#pieces{position:absolute;inset:0;pointer-events:none;z-index:3}
.tok{position:absolute;border-radius:50%;background-size:cover;background-position:center;box-shadow:0 0 0 2px #f2d27e,0 0 0 3px #4f330d,0 3px 8px rgba(0,0,0,.7),0 0 14px rgba(255,210,120,.55);animation:tin .5s cubic-bezier(.2,1.6,.4,1)}
.tok.given::after{content:"";position:absolute;right:-10%;bottom:-10%;width:36%;height:36%;border-radius:50%;background:radial-gradient(circle at 40% 35%,#e0584a,#8e1b14 70%);box-shadow:0 0 0 1.5px #f2d27e,0 2px 4px rgba(0,0,0,.6)}
.tok.bad{box-shadow:0 0 0 2px #ff6b5a,0 0 22px #ff3b2a;animation:tbad 1s forwards}
@keyframes tin{from{transform:scale(0) rotate(-40deg);opacity:0}}
@keyframes tbad{0%{transform:scale(0)}25%{transform:scale(1.05)}55%{transform:scale(1) rotate(6deg);opacity:1}100%{transform:scale(1.4) rotate(-10deg);filter:grayscale(1) blur(4px);opacity:0}}
.tok.cheer{animation:cheer .7s ease-in-out}
@keyframes cheer{40%{transform:translateY(-30%) scale(1.15)}70%{transform:translateY(4%) scale(.96)}}
.tok.wig{animation:wig .5s}
@keyframes wig{25%{transform:rotate(-12deg)}75%{transform:rotate(12deg)}}
.ring{position:absolute;border-radius:50%;pointer-events:none;box-shadow:0 0 0 2px rgba(255,230,160,.9),0 0 18px rgba(255,210,110,.8);animation:ring .7s ease-out forwards;z-index:4}
@keyframes ring{from{transform:scale(.5);opacity:1}to{transform:scale(2.3);opacity:0}}
.tools{display:flex;gap:8px;align-items:center}
.tools .gbtn{flex:1;display:flex;align-items:center;justify-content:center;gap:6px;padding:6px 6px;font-size:15px}
.tools svg{width:20px;height:20px;flex:none}
.seg{display:flex;padding:3px;gap:3px;border-radius:12px;background:rgba(10,8,6,.82);box-shadow:inset 0 0 0 1px rgba(240,207,122,.5);flex:none}
.seg button{border:none;background:none;cursor:pointer;width:44px;height:40px;border-radius:9px;display:grid;place-items:center;color:rgba(240,207,122,.65);transition:.25s;padding:0}
.seg button svg{width:22px;height:22px}
.seg button.on{background:linear-gradient(180deg,#f2d27e,#b8862f);color:#2b1a06;box-shadow:0 0 12px rgba(240,190,90,.5)}
.seg .mt{width:28px;height:28px;border-radius:50%;background-size:cover;box-shadow:0 0 0 1.5px #f2d27e}
.bonus{display:grid;grid-template-columns:repeat(4,1fr);gap:8px}
.bon{position:relative;border:none;cursor:pointer;display:flex;flex-direction:column;align-items:center;gap:2px;padding:7px 2px 6px;border-radius:12px;background:linear-gradient(180deg,rgba(32,22,12,.84),rgba(10,8,6,.92));box-shadow:inset 0 0 0 1px rgba(240,207,122,.5),0 6px 16px rgba(0,0,0,.45);color:#f6e2b0;font-family:'Cormorant SC',Georgia,serif;font-weight:700;font-size:14px;letter-spacing:.02em;transition:transform .12s}
.bon:active{transform:scale(.95)}
.bon .ic{width:40px;height:40px;border-radius:50%;display:grid;place-items:center;background:radial-gradient(circle at 50% 40%,rgba(255,220,140,.28),rgba(0,0,0,0) 70%)}
.bon .ic svg{width:34px;height:34px}
.bon .ct{position:absolute;top:4px;right:6px;min-width:22px;height:22px;padding:0 5px;border-radius:11px;background:radial-gradient(circle at 40% 35%,#e0584a,#8e1b14);color:#fff;font-family:'Cormorant Garamond',Georgia,serif;font-size:14px;display:grid;place-items:center;box-shadow:0 0 0 1.5px #f2d27e}
.bon .ct.z{background:radial-gradient(circle at 40% 35%,#f2d27e,#9c6c22);color:#2b1a06;font-size:15px}
.bon.used{animation:bused .6s}
@keyframes bused{40%{transform:scale(1.12);box-shadow:inset 0 0 0 1px #fff3c8,0 0 30px rgba(255,220,130,.85)}}
#modal{position:fixed;inset:0;z-index:20;display:grid;place-items:center;padding:16px;background:rgba(3,4,8,.62);backdrop-filter:blur(5px);-webkit-backdrop-filter:blur(5px);opacity:0;pointer-events:none;transition:opacity .35s}
#modal.on{opacity:1;pointer-events:auto}
#modal.clear{background:rgba(3,4,8,.25);backdrop-filter:none;-webkit-backdrop-filter:none}
#mcard{width:100%;max-width:440px;max-height:calc(100vh - 32px);overflow-y:auto;position:relative;transform:translateY(24px) scale(.96);transition:transform .45s cubic-bezier(.2,1.3,.3,1);scrollbar-width:thin;scrollbar-color:#8a5f1e transparent}
#modal.on #mcard{transform:none}
#mcard.hasSeal{overflow:visible;margin-top:40px}
.parch{color:#3a2610;padding:24px 22px 20px;border-radius:6px;background-color:#ead6a6;background-image:radial-gradient(ellipse at 50% 40%,rgba(255,250,230,.75),rgba(255,250,230,0) 60%),var(--noise),radial-gradient(ellipse at center,#f4e4bd 0%,#e4c98f 70%,#c49a5a 100%);background-size:100% 100%,120px 120px,100% 100%;box-shadow:inset 0 0 0 1px rgba(120,80,30,.5),inset 0 0 50px rgba(120,70,20,.45),0 24px 70px rgba(0,0,0,.75)}
.parch h2,.parch h3{font-family:'Cormorant SC',Georgia,serif;color:#5a2e0c;margin:0}
.dark{padding:22px 18px 18px}
.dark h2{margin:0;font-family:'Cormorant SC',Georgia,serif;font-size:30px;text-align:center}
.dark .sub{text-align:center;font-style:italic;color:rgba(243,228,192,.78);margin-top:2px}
.mx{position:absolute;top:8px;right:8px;width:44px;height:44px;border:none;background:none;cursor:pointer;color:inherit;font-size:28px;line-height:1;opacity:.75;z-index:2}
.mrow{display:flex;gap:10px;margin-top:16px}
.mrow>*{flex:1}
.seal{width:76px;height:76px;margin:-62px auto 6px;border-radius:47% 53% 50% 50%/52% 46% 54% 48%;display:grid;place-items:center;font-family:'Cormorant SC',Georgia,serif;font-weight:700;font-size:34px;color:#f6d7a0;background:radial-gradient(circle at 38% 30%,#e0584a,#a5221b 45%,#5e0f0b 85%);box-shadow:inset 0 0 0 5px rgba(0,0,0,.2),inset 0 -6px 12px rgba(0,0,0,.35),0 6px 16px rgba(0,0,0,.5);text-shadow:0 -1px 0 rgba(0,0,0,.6)}
.win{text-align:center}
.kick{font-family:'Cormorant SC',Georgia,serif;font-weight:700;letter-spacing:.2em;font-size:14px;color:#7a4a1a}
.win h2{font-size:38px;line-height:1.05;margin:4px 0 0}
.wstars{display:flex;justify-content:center;align-items:flex-end;gap:6px;margin:8px 0 10px}
.wstars svg{width:52px;height:52px;opacity:0;animation:sdrop .6s cubic-bezier(.2,1.6,.4,1) forwards}
.wstars svg:nth-child(2){width:66px;height:66px;margin-bottom:8px}
@keyframes sdrop{from{opacity:0;transform:translateY(-40px) scale(2) rotate(-60deg)}to{opacity:1;transform:none}}
.wstats{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin:4px 0 12px}
.wstats div{padding:8px 4px;border-radius:8px;background:rgba(120,80,30,.12);box-shadow:inset 0 0 0 1px rgba(120,80,30,.28);font-weight:700;font-size:21px;color:#4a2a0c;display:flex;flex-direction:column;align-items:center;justify-content:center;line-height:1.1}
.wstats small{font-size:14px;font-weight:500;color:#6d4a22;line-height:1.15;margin-top:2px}
.quote{font-family:'Marck Script',cursive;font-size:23px;line-height:1.25;color:#4a2a0c;margin:4px 6px 0}
.quote small{display:block;font-family:'Cormorant Garamond',Georgia,serif;font-style:italic;font-size:15px;color:#7a5a32;margin-top:4px}
.lose{text-align:center;color:#e6f0ff}
.lose h2{font-size:32px;color:#e3ecff;text-shadow:0 0 20px rgba(160,200,255,.6)}
.lose p{color:rgba(225,235,255,.88);font-size:18px;margin:8px 0}
.frost{position:fixed;inset:0;z-index:15;pointer-events:none;opacity:0;transition:opacity 1.2s;background:radial-gradient(ellipse at center,rgba(200,220,255,0) 35%,rgba(170,200,240,.3) 70%,rgba(225,238,255,.78) 100%)}
.frost.on{opacity:1}
.dem{position:fixed;z-index:16;width:150px;pointer-events:none;opacity:0;transition:opacity 1.5s,transform 1.5s;filter:blur(1px) drop-shadow(0 0 22px rgba(0,0,0,.9))}
.dem.on{opacity:.88}
.dem svg{width:100%;animation:dem 6s ease-in-out infinite alternate}
@keyframes dem{from{transform:translate(0,0) rotate(-4deg)}to{transform:translate(26px,-34px) rotate(5deg)}}
.list{display:flex;flex-direction:column;gap:10px;margin-top:12px}
.item{display:flex;gap:12px;align-items:center;padding:10px 12px;border-radius:10px;background:rgba(255,240,200,.05);box-shadow:inset 0 0 0 1px rgba(240,207,122,.28)}
.item .ii{width:52px;height:52px;flex:none;border-radius:50%;display:grid;place-items:center;background:radial-gradient(circle at 50% 38%,rgba(255,220,140,.25),rgba(0,0,0,.3) 75%);box-shadow:inset 0 0 0 1px rgba(240,207,122,.4);background-size:cover;background-position:center}
.item .ii svg{width:36px;height:36px}
.item .ii.tk{box-shadow:0 0 0 2px #f2d27e,0 0 12px rgba(255,210,120,.4)}
.item .id{flex:1;min-width:0}
.item .id b{display:block;font-size:19px;color:#fff1cc;line-height:1.15}
.item .id span{font-size:15px;color:rgba(243,228,192,.75);line-height:1.2;display:block}
.item .gbtn,.item .btn{min-height:44px;padding:6px 12px;font-size:16px;flex:none;display:flex;align-items:center;gap:4px}
.item .btn svg,.item .gbtn svg{width:18px;height:18px}
.item.off{opacity:.5}
.item.got .ii{box-shadow:0 0 0 2px #f2d27e,0 0 14px rgba(255,210,120,.5)}
.sect{font-family:'Cormorant SC',Georgia,serif;font-weight:700;letter-spacing:.16em;font-size:15px;color:#e9cf8f;margin:18px 2px 0;display:flex;align-items:center;gap:10px}
.sect::after{content:"";flex:1;height:1px;background:linear-gradient(90deg,rgba(240,207,122,.6),transparent)}
.tog{display:flex;align-items:center;justify-content:space-between;gap:12px;padding:10px 4px;border-bottom:1px solid rgba(240,207,122,.15);font-size:18px}
.tog span small{display:block;font-size:14.5px;color:rgba(243,228,192,.65)}
.sw{width:54px;height:30px;border-radius:15px;border:none;cursor:pointer;position:relative;background:rgba(0,0,0,.5);box-shadow:inset 0 0 0 1px rgba(240,207,122,.5);flex:none;padding:0}
.sw::after{content:"";position:absolute;top:4px;left:4px;width:22px;height:22px;border-radius:50%;background:#8a7a5a;transition:.25s}
.sw.on{background:linear-gradient(180deg,#cf9f45,#8a5f1e)}
.sw.on::after{left:28px;background:#fff3c8;box-shadow:0 0 10px #ffd36a}
input.spell{width:100%;height:54px;margin-top:14px;padding:0 16px;border-radius:10px;border:none;background:rgba(0,0,0,.55);box-shadow:inset 0 0 0 1px rgba(240,207,122,.55);color:#fff1cc;font-family:'Marck Script',cursive;font-size:24px;outline:none}
input.spell:focus{box-shadow:inset 0 0 0 2px #f2d27e,0 0 16px rgba(240,190,90,.4)}
input.name{width:100%;height:46px;margin:4px 0 0;padding:0 12px;border:none;border-bottom:2px solid rgba(90,50,15,.5);background:rgba(255,250,230,.4);font-family:'Marck Script',cursive;font-size:24px;color:#3a2610;outline:none;border-radius:4px 4px 0 0}
.rules{display:flex;flex-direction:column;gap:12px;margin-top:12px}
.rule{display:flex;gap:12px;align-items:center}
.rule svg{width:76px;height:76px;flex:none;border-radius:6px;box-shadow:0 0 0 1.5px #8a5f1e,0 3px 8px rgba(0,0,0,.3)}
.rule p{margin:0;font-size:17px;line-height:1.3}
.rule b{color:#5a2e0c}
#toasts{position:fixed;left:0;right:0;top:max(64px,calc(env(safe-area-inset-top) + 56px));z-index:30;display:flex;flex-direction:column;align-items:center;gap:8px;pointer-events:none;padding:0 12px}
.toast{max-width:440px;padding:10px 16px;border-radius:12px;display:flex;gap:10px;align-items:center;font-size:17px;line-height:1.25;color:#fff1cc;background:linear-gradient(180deg,rgba(30,22,12,.96),rgba(12,9,6,.97));box-shadow:inset 0 0 0 1px rgba(240,207,122,.6),0 10px 30px rgba(0,0,0,.6),0 0 30px rgba(240,190,90,.2);animation:tin2 .45s cubic-bezier(.2,1.4,.3,1),tout .5s 3.4s forwards}
.toast svg{width:30px;height:30px;flex:none}
.toast b{color:var(--gold)}
@keyframes tin2{from{transform:translateY(-20px) scale(.9);opacity:0}}
@keyframes tout{to{transform:translateY(-14px);opacity:0}}
.pts{position:fixed;z-index:25;pointer-events:none;font-family:'Cormorant SC',Georgia,serif;font-weight:700;font-size:22px;white-space:nowrap;animation:ptsup 1.6s ease-out forwards;transform:translateX(-50%);text-shadow:0 2px 6px #000}
@keyframes ptsup{0%{opacity:0;margin-top:10px}15%{opacity:1}100%{opacity:0;margin-top:-60px}}
#s-intro .col,#s-sort .col{justify-content:center;align-items:center;text-align:center}
.env{width:min(84vw,340px);aspect-ratio:1.55;position:relative;cursor:pointer;margin-top:22px;filter:drop-shadow(0 20px 40px rgba(0,0,0,.7));animation:float 4s ease-in-out infinite alternate;perspective:800px;border:none;padding:0;background:none}
@keyframes float{to{transform:translateY(-10px) rotate(-1deg)}}
.env .body{position:absolute;inset:0;border-radius:4px;background-color:#e9d4a2;background-image:var(--noise),radial-gradient(ellipse at 50% 60%,#f3e3bd,#d8bb80);background-size:120px 120px,100% 100%;box-shadow:inset 0 0 30px rgba(120,70,20,.4)}
.env .flap{position:absolute;left:0;right:0;top:0;height:47%;transform-origin:50% 0;background-color:#e2c88f;background-image:var(--noise),linear-gradient(180deg,#ecd8a8,#cdab6a);background-size:120px 120px,100% 100%;clip-path:polygon(0 0,100% 0,50% 100%);transition:transform .9s ease;z-index:2}
.env.open .flap{transform:rotateX(180deg)}
.env .addr{position:absolute;left:9%;right:6%;bottom:6%;color:#3c2a12;font-family:'Marck Script',cursive;font-size:clamp(16px,4.6vw,20px);line-height:1.25;text-align:left;z-index:1}
.env .wax{position:absolute;left:50%;top:47%;width:60px;height:60px;margin:-30px;z-index:3;border-radius:47% 53% 50% 50%/52% 46% 54% 48%;display:grid;place-items:center;font-family:'Cormorant SC',Georgia,serif;font-weight:700;font-size:28px;color:#f6d7a0;background:radial-gradient(circle at 38% 30%,#e0584a,#a5221b 45%,#5e0f0b 85%);box-shadow:inset 0 0 0 4px rgba(0,0,0,.2),0 4px 10px rgba(0,0,0,.5);transition:opacity .4s}
.env.open .wax{opacity:0}
.tapme{margin-top:22px;font-style:italic;font-size:18px;color:#f3e4c0;animation:foc 1.2s ease-in-out infinite alternate;text-shadow:0 2px 8px #000}
.letter{text-align:left;font-size:17.5px;line-height:1.36}
.letter .hd{text-align:center;font-family:'Cormorant SC',Georgia,serif;font-weight:700;letter-spacing:.08em;color:#5a2e0c;font-size:16px;line-height:1.3}
.letter .crest{display:block;margin:0 auto 6px;width:54px;height:62px}
.letter p{margin:9px 0}
.letter .sig{font-family:'Marck Script',cursive;font-size:26px;color:#3a2610;text-align:right;margin-top:4px;line-height:1.1}
.letter .sig small{display:block;font-family:'Cormorant Garamond',Georgia,serif;font-style:italic;font-size:15px}
.hat{width:min(50vw,220px);aspect-ratio:1;border-radius:50%;background-size:cover;box-shadow:0 0 0 3px #c99a3e,0 0 0 6px #20140a,0 0 0 7px #8a5f1e,0 0 60px rgba(240,190,90,.35);animation:hat 2.4s ease-in-out infinite alternate;flex:none}
@keyframes hat{from{transform:rotate(-3deg)}to{transform:rotate(3deg) scale(1.02)}}
.hat.talk{animation:talk .22s ease-in-out infinite alternate}
@keyframes talk{to{transform:scale(1.04,.96) rotate(1deg)}}
.bubble{margin-top:18px;width:100%;max-width:440px;padding:14px 18px;font-family:'Marck Script',cursive;font-size:24px;line-height:1.25;color:#fff3d6;min-height:66px}
.ans{display:grid;grid-template-columns:1fr 1fr;gap:10px;width:100%;max-width:440px;margin-top:14px}
.ans .gbtn{font-family:'Cormorant Garamond',Georgia,serif;font-size:17px;letter-spacing:0;line-height:1.2;padding:10px;color:#f6e2b0}
.house{font-size:clamp(46px,13vw,64px);font-family:'Cormorant SC',Georgia,serif;font-weight:700;margin:10px 0 0;animation:hz .9s cubic-bezier(.2,1.6,.4,1)}
@keyframes hz{from{transform:scale(2.4);opacity:0;filter:blur(8px)}}
.crestbig{width:110px;height:128px;margin-top:10px;animation:hz .9s .15s cubic-bezier(.2,1.6,.4,1) backwards}
.fly{position:fixed;z-index:26;pointer-events:none;left:0;top:0}
#snitch{position:fixed;z-index:27;width:70px;height:44px;margin:-22px 0 0 -35px;cursor:pointer;display:none;filter:drop-shadow(0 0 10px rgba(255,210,90,.9));border:none;background:none;padding:0;left:0;top:0}
#snitch .w{transform-box:fill-box;animation:flap .08s linear infinite alternate}
#snitch .wl{transform-origin:100% 60%}
#snitch .wr{transform-origin:0% 60%}
@keyframes flap{to{transform:scaleY(.2)}}
#lumos{position:fixed;z-index:24;width:380px;height:380px;margin:-190px;border-radius:50%;pointer-events:none;display:none;mix-blend-mode:screen;background:radial-gradient(circle,rgba(255,250,225,.6),rgba(255,230,160,.2) 35%,rgba(255,220,140,0) 70%);left:50%;top:50%}
body.lumos #lumos{display:block}
body.lumos #shade{opacity:.55}
body.nox #shade{background:rgba(0,0,0,.72)!important}
body.nox #candles{opacity:.15}
#mmap{position:fixed;inset:0;z-index:23;pointer-events:none;display:none;background:rgba(170,120,60,.22);mix-blend-mode:multiply}
body.marauder #mmap{display:block}
body.marauder .bgl{filter:sepia(.9) contrast(1.05) brightness(1.05)}
.foot{position:fixed;z-index:24;width:12px;height:20px;margin:-10px 0 0 -6px;pointer-events:none;animation:foot 3.4s forwards}
@keyframes foot{0%{opacity:0}10%{opacity:.9}70%{opacity:.9}100%{opacity:0}}
.mlabel{position:fixed;z-index:24;pointer-events:none;font-family:'Marck Script',cursive;font-size:17px;color:#4a2a0c;background:#efdcb0;padding:1px 8px;border:1px solid #6d4a22;transform:translate(-50%,-150%);white-space:nowrap;box-shadow:0 2px 6px rgba(0,0,0,.4)}
body.levi .lv{animation:levi 2.4s ease-in-out infinite alternate}
body.levi .lv:nth-child(2n){animation-delay:-.8s}
body.levi .lv:nth-child(3n){animation-delay:-1.5s}
@keyframes levi{from{transform:translateY(0) rotate(0)}to{transform:translateY(-22px) rotate(1.5deg)}}
body.ridd .tok{animation:ridd .5s ease-in-out infinite alternate}
@keyframes ridd{from{transform:rotate(-18deg) scale(.9)}to{transform:rotate(18deg) scale(1.1,.85)}}
.flash{position:fixed;inset:0;z-index:28;pointer-events:none;animation:flash 1.2s forwards}
@keyframes flash{0%{opacity:0}12%{opacity:.85}100%{opacity:0}}
.epi{position:fixed;inset:0;z-index:40;background:#000;display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center;padding:24px;opacity:0;transition:opacity 2s}
.epi.on{opacity:1}
.epi .l{opacity:0;transition:opacity 2s;margin:8px 0}
.epi .l.on{opacity:1}

.mtile b{font-family:'Cormorant SC',Georgia,serif;font-size:16.5px;font-weight:700;letter-spacing:.02em}
.mtile small{font-family:'Cormorant Garamond',Georgia,serif;font-size:13px;font-weight:700;opacity:.8}
.mtile.ez{color:#ffe2b8;background:linear-gradient(180deg,rgba(48,26,10,.9),rgba(18,9,4,.94));box-shadow:inset 0 0 0 1px rgba(255,196,120,.6),inset 0 0 0 3px rgba(0,0,0,.4),0 6px 16px rgba(0,0,0,.5)}
.mtile.ez svg{color:#ffc97a}
.mtile.md{color:#d6e6ff;background:linear-gradient(180deg,rgba(14,24,44,.9),rgba(4,8,18,.94));box-shadow:inset 0 0 0 1px rgba(150,190,255,.55),inset 0 0 0 3px rgba(0,0,0,.4),0 6px 16px rgba(0,0,0,.5)}
.mtile.md svg{color:#a9c8ff}
.mtile.du{color:#ffd6d0;background:linear-gradient(180deg,rgba(52,12,14,.9),rgba(20,4,6,.94));box-shadow:inset 0 0 0 1px rgba(255,140,120,.55),inset 0 0 0 3px rgba(0,0,0,.4),0 6px 16px rgba(0,0,0,.5)}
.mtile.du svg{color:#ff9d8a}
@media (max-height:700px){.mtile{min-height:64px;padding:5px 3px}.mtile svg{width:20px;height:20px}.mtile b{font-size:15.5px}}
#s-ez .node.cur .m{background:radial-gradient(circle at 38% 30%,#ffc983,#b8641c 45%,#4f2408 85%);color:#fff4e4}
#s-ez .node.cur .m::after{box-shadow:0 0 0 7px rgba(255,190,120,.45)}
#s-ez .node .m{font-size:23px}
#s-duel .col{display:flex;flex-direction:column;min-height:0}
.dscroll{flex:1;min-height:0;overflow-y:auto;-webkit-overflow-scrolling:touch;padding:0 2px 24px}
.dintro{text-align:center;font-size:16px;margin:6px 4px 10px}
.dsec{font-family:'Cormorant SC',Georgia,serif;font-weight:700;color:var(--gold);letter-spacing:.12em;font-size:15px;margin:16px 4px 8px;text-transform:uppercase}
.dsec small{opacity:.65;letter-spacing:0;font-size:14px}
.dopp{align-items:center}
.dopp .id{flex:1;min-width:0}
.dopp .id .dd{display:block;opacity:.75;font-size:14px}
.dopp .btn{flex:none;min-height:40px;padding:6px 14px;font-size:16px;width:auto}
.dopp.off{opacity:.6}
.dsz{margin-bottom:10px}
.dsz button{font-size:14px}
.dchip{gap:5px;padding-left:4px}
.dpips{display:flex;gap:3px;align-items:center}
.dpips i{width:9px;height:9px;border-radius:50%;background:rgba(240,207,122,.12);box-shadow:inset 0 0 0 1px rgba(240,207,122,.55)}
.dpips i.on{background:#ff7a5c;box-shadow:0 0 5px rgba(255,122,92,.8)}
#dcd{position:fixed;inset:0;display:none;place-items:center;pointer-events:none;z-index:60;font-family:'Cormorant SC',Georgia,serif;font-weight:700;font-size:92px;color:#f6dc8f;text-shadow:0 4px 24px rgba(0,0,0,.85),0 0 30px rgba(255,200,90,.5)}
#dcd.on{display:grid;animation:dcpop .72s ease-out both}
@keyframes dcpop{0%{opacity:0;transform:scale(1.6)}25%{opacity:1;transform:scale(1)}80%{opacity:1}100%{opacity:0;transform:scale(.85)}}
.dwhy{text-align:center;font-size:18px;margin:0 0 8px}
.dlost h2{color:#7a1d12}
.dopp{background:linear-gradient(180deg,rgba(22,15,9,.86),rgba(8,6,4,.9))}
#s-duel .chhead .ps,#s-duel .dintro,#s-duel .dsec{text-shadow:0 2px 8px #000,0 0 3px #000}
@media (max-height:700px){.hardbtn small{font-size:13px}}

    for (let it = 0; it < 2000; it++) {
      if (pl.reduce((a, b) => a + b, 0) === n) return { ok: true, steps, pl };
      const s = step(cand, pl);
      if (!s || s.t === 'dead') return { ok: false, steps, pl };
      steps.push(s); apply(s, cand, pl);
    }
    return { ok: false, steps, pl };
  }
  return { step, apply, solve, sees, seeList, units, N };
}

const NS='sovudoku-hp-x7k2/v1/';
const BROKERS=[{url:'wss://broker.emqx.io:8084/mqtt'},{url:'wss://broker.hivemq.com:8884/mqtt'},{url:'wss://public.cloud.shiftr.io:443',u:'public',p:'public'}];
const esc=s=>String(s==null?'':s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const myName=()=>(S.name||'').trim().slice(0,18)||'Волшебник';
/* minimal MQTT 3.1.1 over WebSocket (QoS 0). Держим ОДНО соединение (с переключением на запасной брокер); все брокеры сразу — только пока открыта таблица рекордов */
const MQ={conns:[],pi:0,boosted:false,ready:false,subs:new Set(),want:false,enc:new TextEncoder(),dec:new TextDecoder(),onmsg:null,onstate:null,onmore:null,seen:new Map(),
 str(s){const b=this.enc.encode(s);return [b.length>>8,b.length&255,...b]},
 len(n){const o=[];do{let d=n%128;n=Math.floor(n/128);if(n>0)d|=128;o.push(d)}while(n>0);return o},
 send(c,h,body){if(!c.ws||c.ws.readyState!==1)return false;try{c.ws.send(new Uint8Array([h,...this.len(body.length),...body]));return true}catch(e){return false}},
 start(){this.want=true;if(!this.conns.length)this.conns=BROKERS.map(B=>({url:B.url,cr:B.u?[...this.str(B.u),...this.str(B.p)]:null,ws:null,ok:false,buf:new Uint8Array(0),fails:0,pid:1,ping:null,rt:null}));this.ensure()},
 ensure(){if(!this.want)return;const prim=this.conns[this.pi];this.conns.forEach((c,i)=>{const need=this.boosted||i===this.pi;if(need){if(!c.ws&&!c.rt)this.open(c)}else if(c.ws&&prim&&prim.ok)this.close1(c)})},
 close1(c){clearTimeout(c.rt);c.rt=null;clearInterval(c.ping);const ws=c.ws;if(ws){try{this.send(c,0xE0,[])}catch(e){}c.ws=null;try{ws.close()}catch(e){}}c.ok=false;this.upd()},
 boost(on){this.boosted=!!on;clearTimeout(this.bT);if(on)this.ensure();else this.bT=setTimeout(()=>this.ensure(),15000)},
 failover(c){const i=this.conns.indexOf(c);if(i===this.pi&&!this.ready&&c.fails>=2){this.pi=(i+1)%this.conns.length;this.ensure()}},
 stop(){this.want=false;this.conns.forEach(c=>{clearTimeout(c.rt);c.rt=null;clearInterval(c.ping);if(c.ws){try{this.send(c,0xE0,[]);c.ws.close()}catch(e){}}c.ws=null;c.ok=false});this.upd()},
 upd(){const r=this.conns.some(c=>c.ok);if(r!==this.ready){this.ready=r;if(this.onstate)this.onstate(r)}},
 open(c){if(!this.want||c.ws)return;let ws;try{ws=new WebSocket(c.url,'mqtt')}catch(e){this.retry(c);return}
  c.ws=ws;ws.binaryType='arraybuffer';c.buf=new Uint8Array(0);const to=setTimeout(()=>{if(!c.ok){try{ws.close()}catch(e){}}},10000);
  ws.onopen=()=>{const cid='sv'+String(S.pid||'').slice(1,9)+Math.random().toString(36).slice(2,7);this.send(c,0x10,[0,4,77,81,84,84,4,c.cr?0xC2:2,0,60,...this.str(cid),...(c.cr||[])])};
  ws.onmessage=e=>{if(c.ws!==ws)return;const a=new Uint8Array(e.data),b=new Uint8Array(c.buf.length+a.length);b.set(c.buf);b.set(a,c.buf.length);c.buf=b;this.parse(c)};
  ws.onclose=()=>{clearTimeout(to);if(c.ws!==ws)return;clearInterval(c.ping);const was=c.ok;c.ok=false;c.ws=null;if(!was)c.fails++;else c.fails=0;this.upd();this.retry(c);this.failover(c)};
  ws.onerror=()=>{}},
 retry(c){if(!this.want)return;clearTimeout(c.rt);const d=Math.min(60000,2500*Math.pow(2,Math.min(c.fails,5)))*(0.7+Math.random()*0.6);c.rt=setTimeout(()=>{c.rt=null;if(this.boosted||this.conns.indexOf(c)===this.pi)this.open(c)},c.fails?d:1500)},
 parse(c){for(;;){const b=c.buf;if(b.length<2)return;let m=1,v=0,k=1,d;do{if(k>=b.length)return;d=b[k++];v+=(d&127)*m;m*=128}while(d&128);if(b.length<k+v)return;
  const h=b[0],body=b.subarray(k,k+v);c.buf=b.slice(k+v);const t=h>>4;
  if(t===2){if(body[1]===0){c.ok=true;c.fails=0;clearInterval(c.ping);c.ping=setInterval(()=>this.send(c,0xC0,[]),25000);for(const s of this.subs)this.sub1(c,s);const first=!this.ready;this.upd();if(!first&&this.onmore)this.onmore();this.ensure()}else{try{c.ws.close()}catch(e){}}}
  else if(t===3){const tl=(body[0]<<8)|body[1];const topic=this.dec.decode(body.subarray(2,2+tl));let p=2+tl;if((h>>1)&3)p+=2;let msg=null;try{msg=JSON.parse(this.dec.decode(body.subarray(p)))}catch(e){}
   if(msg&&typeof msg==='object'){const q=msg._q;if(q){if(this.seen.has(q))continue;this.seen.set(q,1);if(this.seen.size>800){const it=this.seen.keys();for(let z=0;z<300;z++)this.seen.delete(it.next().value)}}
    if(this.onmsg)try{this.onmsg(topic,msg)}catch(e){console.warn(e)}}}}},
 sub1(c,t){const id=c.pid++&65535||(c.pid=2,1);this.send(c,0x82,[id>>8,id&255,...this.str(t),0])},
 sub(t){if(this.subs.has(t))return;this.subs.add(t);this.conns.forEach(c=>{if(c.ok)this.sub1(c,t)})},
 unsub(t){if(!this.subs.delete(t))return;this.conns.forEach(c=>{if(c.ok){const id=c.pid++&65535||(c.pid=2,1);this.send(c,0xA2,[id>>8,id&255,...this.str(t)])}})},
 pub(t,o,ret){if(!this.ready)return false;o._q=Math.random().toString(36).slice(2,11);const body=[...this.str(t),...this.enc.encode(JSON.stringify(o))];let k=false;this.conns.forEach(c=>{if(c.ok&&this.send(c,ret?0x31:0x30,body))k=true});return k}};
/* ---- presence, rooms ---- */
const NET={role:null,room:null,host:null,mem:{},peers:{},last:0,pend:{},sT:null,wait:false,conn:false,
 me(){return{id:S.pid,n:myName(),h:S.house||'G'}},
 status(){return this.role==='host'?'host':this.role==='guest'?'guest':'free'},
 setOnline(on){if(on){REC.temp=false;MQ.start();if(MQ.ready)this.onstate(true)}else{this.leave(true);this.pub('lobby',{t:'bye',id:S.pid});setTimeout(()=>MQ.stop(),150);this.peers={};this.ui()}},
 pub(t,o){return MQ.pub(NS+t,o)},
 presence(){this.pub('lobby',Object.assign({t:'pr',s:this.status(),lv:(curScreen==='s-game'&&G)?String(G.name).slice(0,40):'',with:this.role==='guest'&&this.host?this.host.n:''},this.me()))},
 online(){const now=Date.now();return Object.values(this.peers).filter(p=>now-p.seen<70000&&p.id!==S.pid)},
 onstate(ok){this.conn=ok;if(ok){MQ.sub(NS+'lobby');MQ.sub(NS+'u/'+S.pid);this.pub('lobby',Object.assign({t:'hi'},this.me()));this.presence();
   if(this.role==='host')MQ.sub(NS+'r/'+this.room+'/a');if(this.role==='guest'){MQ.sub(NS+'r/'+this.room+'/s');this.toHost({t:'join'})}
   const j=pendingJoin;if(j){pendingJoin=null;this.join(j.room,{id:j.host,n:'хозяин',h:'G'})}}this.ui()},
 onmsg(topic,m){const T=topic.slice(NS.length);if(m.id===S.pid&&T==='lobby')return;
  if(T==='lobby'){if(typeof m.id!=='string')return;if(m.t==='hi'){setTimeout(()=>this.presence(),300+Math.random()*1200);this.peers[m.id]=Object.assign(this.peers[m.id]||{},{id:m.id,n:m.n,h:m.h,s:'free',seen:Date.now()})}
   else if(m.t==='pr')this.peers[m.id]={id:m.id,n:String(m.n||'').slice(0,18),h:HOUSES[m.h]?m.h:'G',s:m.s,lv:m.lv,with:m.with,seen:Date.now()};
   else if(m.t==='bye')delete this.peers[m.id];this.ui();return}
  if(T==='u/'+S.pid){if(m.t==='inv')this.gotInvite(m);else if(m.t==='dec'){toast(`<b>${esc(m.n)}</b> пока не может: ${m.busy?'уже играет с кем-то':'отказался(ась) — сова вернулась ни с чем'}.`,I.owlI.replace('currentColor','#f2d27e'))}return}
  if(this.role==='host'&&T==='r/'+this.room+'/a')return this.hostGot(m);
  if(this.role==='guest'&&T==='r/'+this.room+'/s')return this.guestGot(m)},
 /* host */
 ensureRoom(){if(this.role==='host')return;if(this.role==='guest')this.leave(true);this.role='host';this.room=Math.random().toString(36).slice(2,8);this.mem={};MQ.sub(NS+'r/'+this.room+'/a');this.presence();this.ui()},
 invite(p){if(!this.conn){toast('Нет связи с Совятней. Проверь интернет.');return}this.ensureRoom();
  this.pub('u/'+p.id,Object.assign({t:'inv',room:this.room,lv:(curScreen==='s-game'&&G)?String(G.num+' · '+G.name):''},this.me()));
  owlFly();toast(`Сова с приглашением летит к <b>${esc(p.n)}</b>…`,I.owlI.replace('currentColor','#f2d27e'))},
 link(){this.ensureRoom();return location.href.split('#')[0]+'#join='+this.room+'.'+S.pid},
 toRoom(o){o.by=S.pid;return this.pub('r/'+this.room+'/s',o)},
 hostGot(m){const id=m.by;if(typeof id!=='string')return;const now=Date.now();
  if(m.t==='join'){const isNew=!this.mem[id];this.mem[id]={id,n:String(m.n||'Гость').slice(0,18),h:HOUSES[m.h]?m.h:'G',seen:now};if(isNew){toast(`<b>${esc(this.mem[id].n)}</b> влетает в окно! Играем вместе.`,avatar(this.mem[id],30));AU.magic()}
   this.sendMem();if(curScreen==='s-game'&&G&&!G.netGuest)this.sendLevel();else this.toRoom({t:'idle',n:myName()});this.presence();this.ui();return}
  const mm=this.mem[id];if(!mm)return;mm.seen=now;
  if(m.t==='here')return;
  if(m.t==='leave'){delete this.mem[id];toast(`<b>${esc(mm.n)}</b> покинул(а) игру.`);this.sendMem();this.ui();return}
  if(m.t==='act'&&curScreen==='s-game'&&G&&!G.netGuest){this.actor=mm.id;try{this.applyAct(m,mm)}finally{this.actor=null}}},
 applyAct(m,mm){const i=m.i|0;if(G.done&&m.a!=='hint')return;AU.resume();
  if(m.a==='x'&&i>=0&&i<G.N){const s=G.st[i];if(s>=2)return;const batch=[[i,s]];G.st[i]=s===1?0:1;drawCell(i);if(G.st[i])AU.x();G.hist.push(batch);startRun();ringAt(i,mm);this.toRoom({t:'tap',i,w:mm.id})}
  else if(m.a==='place'&&i>=0&&i<G.N){if(G.st[i]<2){if(m.prev===0||m.prev===1)G.st[i]=m.prev;ringAt(i,mm);place(i)}}
  else if(m.a==='mark'&&Array.isArray(m.c)){const v=m.v?1:0,batch=[];m.c.slice(0,200).forEach(j=>{j|=0;if(j>=0&&j<G.N)markCell(j,v,batch)});if(batch.length){G.hist.push(batch);startRun()}}
  else if(m.a==='undo')undo();else if(m.a==='hint')hint();else if(m.a==='bonus'&&BON.some(b=>b.id===m.b))useBonus(m.b)},
 sendMem(){this.toRoom({t:'mem',host:this.me(),list:Object.values(this.mem).map(x=>({id:x.id,n:x.n,h:x.h}))})},
 spec(){const L=G;return{key:L.key,n:L.n,r:L.reg.map(g=>String.fromCharCode(65+g)).join(''),s:L.sol.map(i=>i%L.n),g:L.givens,c:L.curse||[],name:L.name,num:L.num,hard:!!L.hard,mid:!!L.mid,ez:!!L.ez,ch:L.ch,label:L.label,q:L.q||null}},
 snap(){this.sq=Math.max(Date.now(),(this.sq||0)+1);return{t:'snap',sq:this.sq,st:Array.from(G.st).join(''),h:G.hearts,mh:G.maxH,m:G.mistakes,e:Math.round(G.elapsed),run:G.running,rot:G.rot||0,pal:G.pal,lim:G.limit,wand:G.wand,cz:G.cz,done:G.done,key:G.key}},
 sendLevel(){if(this.role!=='host'||!Object.keys(this.mem).length||(G&&G.duel))return;this.toRoom({t:'lvl',L:this.spec(),snap:this.snap()})},
 sched(){if(this.role!=='host'||!Object.keys(this.mem).length||!G||G.netGuest)return;if(this.sT)return;this.sT=setTimeout(()=>{this.sT=null;if(curScreen==='s-game'&&G)this.toRoom(this.snap())},70)},
 /* guest */
 gotInvite(m){if(typeof m.room!=='string'||typeof m.id!=='string')return;const H=HOUSES[m.h]?m.h:'G';const from={id:m.id,n:String(m.n||'Волшебник').slice(0,18),h:H};
  if(this.role==='guest'&&this.host&&this.host.id===from.id)return;
  if(this.role){this.pub('u/'+from.id,Object.assign({t:'dec',busy:1},this.me()));return}
  owlFly(true);AU.magic();vib([30,40,30]);
  modal(`<div class="parch letter2"><div class="seal2" style="background:radial-gradient(circle at 40% 35%,${HOUSES[H].c1},#2a0a06 80%)">${HOUSES[H].L}</div><div class="kick" style="text-align:center;letter-spacing:.3em;font-family:'Cormorant SC',serif;font-weight:700;color:#7a4a12">СОВИНАЯ ПОЧТА</div>
  <h2 style="text-align:center;font-size:28px;margin:4px 0">Приглашение</h2><p class="hand" style="font-size:26px;text-align:center;margin:6px 0;color:#3a2208">«Сыграем вместе?»</p>
  <p style="font-size:18px;text-align:center;margin:0">${avatar(from,26)} <b>${esc(from.n)}</b>, ${HOUSES[H].n}, зовёт тебя решать загадки вместе${m.lv?` — сейчас на уровне «${esc(m.lv)}»`:''}. Вы будете видеть одно поле и ходить одновременно.</p>
  <div class="mrow"><button class="gbtn" id="ivno">Не сейчас</button><button class="btn" id="ivok">Влететь в окно</button></div></div>`);
  $('#ivno').onclick=()=>{this.pub('u/'+from.id,Object.assign({t:'dec'},this.me()));closeModal()};$('#ivok').onclick=()=>{closeModal();this.join(m.room,from)}},
 join(room,from){if(this.role==='host')this.leave(true);if(this.role==='guest'&&this.room!==room)this.leave(true);this.role='guest';this.room=room;this.host=from;this.last=Date.now();this.mem={};
  MQ.sub(NS+'r/'+room+'/s');this.toHost({t:'join'});this.presence();this.ui();
  this.waitModal(`Подключаемся к игре <b>${esc(from.n)}</b>…`)},
 toHost(o){Object.assign(o,{by:S.pid,n:myName(),h:S.house||'G'});return this.pub('r/'+this.room+'/a',o)},
 act(o){o.t='act';this.toHost(o)},
 mark(batch,v){const now=performance.now();batch.forEach(([i])=>this.pend[i]=now);this.act({a:'mark',c:batch.map(x=>x[0]),v})},
 guestGot(m){this.last=Date.now();if(m.by&&this.host&&m.by!==this.host.id)return;
  if(m.t==='mem'){if(m.host&&this.host){this.host.n=String(m.host.n||this.host.n).slice(0,18);this.host.h=HOUSES[m.host.h]?m.host.h:this.host.h}this.mem={};(m.list||[]).forEach(x=>{if(x&&x.id)this.mem[x.id]={id:x.id,n:String(x.n||'').slice(0,18),h:HOUSES[x.h]?x.h:'G'}});this.ui();return}
  if(m.t==='lvl'&&m.L){if($('#modal').classList.contains('on'))closeModal();clearFrost();this.wait=false;const L=buildL(m.L);if(!L)return;this.lsq=0;startLevel(L.key,L);this.applySnap(m.snap);this.ui();
   toast(`Играем уровень <b>${esc(this.host.n)}</b>: ${esc(L.name)}`,avatar(this.host,30));return}

 mine(){PT.flush();const st=S.stat||{};const stars=Object.values(S.prog).reduce((a,v)=>a+((v&&v.stars)||0),0);
  return{v:2,id:S.pid,n:myName(),h:S.house||'G',f:st.first||Date.now(),l:st.last||Date.now(),vis:st.vis||1,pl:Math.round(st.play||0),
   cc:CH.map((_,c)=>chDone(c)),sc:['s0','s1'].filter(isDone).length,mc:MCH.map((_,c)=>mDone(c)),hc:HCH.map((_,c)=>hDone(c)),ec:ECH.map((_,c)=>eDone(c)),dw:DUEL.stats().w,st:stars,pts:S.pts|0}},
 clean(m){if(!m||typeof m!=='object'||typeof m.id!=='string'||!m.id||m.id.length>40)return null;
  const num=(x,max)=>{x=+x;return isFinite(x)?Math.max(0,Math.min(max,x)):0},arr=(a,len,max)=>[...Array(len)].map((_,i)=>Math.round(num(Array.isArray(a)?a[i]:0,max)));
  const lim=Date.now()+864e5;return{id:m.id,n:String(m.n||'Волшебник').slice(0,18),h:HOUSES[m.h]?m.h:'G',f:num(m.f,lim),l:num(m.l,lim),vis:Math.round(num(m.vis,1e6)),pl:Math.round(num(m.pl,1e9)),
   cc:arr(m.cc,7,14),sc:Math.round(num(m.sc,2)),mc:arr(m.mc,5,20),hc:arr(m.hc,5,20),ec:arr(m.ec,5,20),dw:Math.round(num(m.dw,1e6)),st:Math.round(num(m.st,1200)),pts:Math.round(num(m.pts,1e7))}},
 got(m){const r=this.clean(m);if(!r||r.id===S.pid)return;this.got1=true;const o=this.all[r.id];if(o&&o.l>r.l)return;this.all[r.id]=r;this.store();if(this.open)this.later()},
 push(force){if(S.set.rec===0||!MQ.ready)return;const now=Date.now();
  if(!force&&now-this.lastPub<20000){clearTimeout(this.pT);this.pT=setTimeout(()=>this.push(true),20000-(now-this.lastPub));return}
  this.lastPub=now;MQ.pub(NS+'rec/'+S.pid,this.mine(),true)},
 later(){if(this.rT)return;this.rT=setTimeout(()=>{this.rT=null;this.redraw()},350)},
 total(r){const s=a=>a.reduce((x,y)=>x+y,0);return s(r.cc)+r.sc+s(r.mc)+s(r.hc)+s(r.ec)},
 redraw(){const c=$('#recs');if(!c)return;const card=$('#mcard'),top=card?card.scrollTop:0;
  const me=Object.assign(this.clean(this.mine()),{me:1}),list=[me,...Object.values(this.all).filter(r=>r.id!==S.pid)];
  const T=r=>this.total(r),sum=a=>a.reduce((x,y)=>x+y,0);
  const by={lv:(a,b)=>T(b)-T(a)||b.st-a.st||b.pl-a.pl,st:(a,b)=>b.st-a.st||T(b)-T(a),dw:(a,b)=>b.dw-a.dw||T(b)-T(a),pl:(a,b)=>b.pl-a.pl,l:(a,b)=>b.l-a.l};list.sort(by[recSort]||by.lv);
  const val=r=>recSort==='st'?[r.st,'звёзд']:recSort==='pl'?[recDur(r.pl),'в игре']:recSort==='l'?[r.vis,'визитов']:recSort==='dw'?[r.dw,'побед']:[T(r),'уровней'];
  const st=S.set.rec===0?'Твои результаты скрыты (см. Опции)':MQ.ready&&MQ.subs.has(NS+'rec/+')?`На связи · игроков в таблице: ${list.length}`:this.syncAt?`Обновлено ${recDate(this.syncAt,1)} · игроков: ${list.length}`:'Таблица обновится при следующем входе в игру';
  const row=(r,i)=>{const v=val(r),open=this.ex.has(r.id);
   return `<div class="item ritem${r.me?' me':''}${open?' open':''}" data-id="${esc(r.id)}"><div class="rk">${i+1}</div><div class="ii" style="background:none;box-shadow:none;width:42px;height:42px">${avatar(r,40)}</div>
   <div class="id"><b>${esc(r.n)}${r.me?' <small>· это ты</small>':''}</b><span>${HOUSES[r.h].n} · ${recAgo(r.l,r.me)}</span>
   <span class="rch"><i>Курсы ${sum(r.cc)+r.sc}</i><i>Хогсмид ${sum(r.ec)}</i><i>Мракоборцы ${sum(r.mc)}</i><i>Запретная ${sum(r.hc)}</i>${r.dw?`<i>Дуэли ${r.dw}</i>`:''}</span></div>
   <div class="rv"><b>${v[0]}</b><small>${v[1]}</small></div>
   <div class="rdet"><div class="rgrid"><div><small>Впервые зашёл</small>${recDate(r.f)}</div><div><small>Последний визит</small>${recDate(r.l,1)}</div><div><small>Всего в игре</small>${recDur(r.pl)}</div>
    <div><small>Визитов</small>${r.vis}</div><div><small>Звёзд</small>${r.st} из 1200</div><div><small>Очков факультета</small>${r.pts}</div><div><small>Побед в дуэлях</small>${r.dw}</div><div><small>Всего уровней</small>${T(r)} из 400</div></div>
    <div class="rline"><b>Хогсмид · ${sum(r.ec)}/100</b>${r.ec.map((n,k)=>`<i class="${n>=20?'full':''}">${ECH[k].rom}: ${n}/20</i>`).join('')}</div>
    <div class="rline"><b>Курсы Хогвартса · ${sum(r.cc)}/98</b>${r.cc.map((n,k)=>`<i class="${n>=14?'full':''}">${CH[k].rom}: ${n}/14</i>`).join('')}<i class="${r.sc>=2?'full':''}">Тайные: ${r.sc}/2</i></div>
    <div class="rline"><b>Школа мракоборцев · ${sum(r.mc)}/100</b>${r.mc.map((n,k)=>`<i class="${n>=20?'full':''}">${MCH[k].rom}: ${n}/20</i>`).join('')}</div>
    <div class="rline"><b>Запретная секция · ${sum(r.hc)}/100</b>${r.hc.map((n,k)=>`<i class="${n>=20?'full':''}">${HCH[k].rom}: ${n}/20</i>`).join('')}</div></div></div>`};
  c.innerHTML=`<button class="mx" data-close aria-label="Закрыть">×</button><h2 class="gt">Таблица рекордов</h2><div class="sub"><i class="dot ${S.set.online&&MQ.ready?'on':''}"></i> ${st}</div>
  <div class="rsort">${[['lv','Уровни'],['st','Звёзды'],['pl','Время'],['l','Визиты'],['dw','Дуэли']].map(([k,t])=>`<button class="${recSort===k?'on':''}" data-s="${k}">${t}</button>`).join('')}</div>
  <div class="list rlist">${list.map(row).join('')}</div>
  <p class="sub" style="font-size:14px;margin-top:12px">Нажми на строку, чтобы увидеть подробности: когда игрок заходил, сколько провёл в игре и какие уровни прошёл. Таблица обновляется сама при каждом входе в игру и каждые несколько минут, пока ты играешь.</p>`;
  c.querySelector('[data-close]').onclick=closeModal;fixMx(card);
  c.querySelectorAll('[data-s]').forEach(b=>b.onclick=()=>{recSort=b.dataset.s;AU.x();this.redraw()});
  c.querySelectorAll('.ritem').forEach(e=>e.onclick=()=>{const id=e.dataset.id;if(this.ex.has(id))this.ex.delete(id);else this.ex.add(id);e.classList.toggle('open');AU.x()});
  if(card)card.scrollTop=top;this.top1(list)},
 top1(list){if(list.length>=3&&list[0].me&&this.total(list[0])>0)award('rec1')},
 /* синхронизация при входе в игру: короткое подключение, отправка своей карточки и получение всех остальных */
 sync(){const now=Date.now();if(this.syncing)return;
  if(now-this.lastSync<60000){clearTimeout(this.sQ);this.sQ=setTimeout(()=>this.sync(),60000-(now-this.lastSync));return}
  this.lastSync=now;this.syncing=true;MQ.sub(NS+'rec/+');if(!MQ.want){this.temp=true;MQ.start()}else if(MQ.ready)setTimeout(()=>this.push(true),800);
  clearTimeout(this.syT);this.syT=setTimeout(()=>this.syncEnd(),this.temp?16000:12000)},
 syncEnd(){this.syncing=false;if(this.got1){this.syncAt=Date.now();try{localStorage.setItem(this.key+'_at',String(this.syncAt))}catch(e){}this.got1=false}
  if(!this.open)MQ.unsub(NS+'rec/+');if(this.temp&&!S.set.online&&!this.open&&!DUEL.busy()){this.temp=false;MQ.stop()}
  const me=Object.assign(this.clean(this.mine()),{me:1}),list=[me,...Object.values(this.all).filter(r=>r.id!==S.pid)];list.sort((a,b)=>this.total(b)-this.total(a)||b.st-a.st);this.top1(list);if(this.open)this.later()}};
let recSort='lv';
function recDur(s){s=Math.round(s||0);if(s<60)return 'меньше минуты';const m=Math.floor(s/60),h=Math.floor(m/60);if(h<1)return m+' мин';if(h<100)return h+' ч '+(m%60)+' мин';return h+' ч'}
function recDate(t,withTime){if(!t)return '—';const d=new Date(t),p=n=>String(n).padStart(2,'0');return `${p(d.getDate())}.${p(d.getMonth()+1)}.${d.getFullYear()}${withTime?` ${p(d.getHours())}:${p(d.getMinutes())}`:''}`}
function recAgo(t,me){if(me)return 'сейчас в игре';const s=(Date.now()-t)/1000;if(s<180)return 'был(а) только что';if(s<3600)return `был(а) ${Math.floor(s/60)} мин назад`;if(s<86400)return `был(а) ${Math.floor(s/3600)} ч назад`;if(s<172800)return 'был(а) вчера';return 'был(а) '+recDate(t)}
function records(){AU.resume();REC.open=true;REC.ex.clear();
 modal(`<div class="panel dark" id="recs"></div>`,{onClose:()=>{REC.open=false;if(!REC.syncing)MQ.unsub(NS+'rec/+');if(REC.temp&&!S.set.online&&!REC.syncing){REC.temp=false;MQ.stop()}}});

{const _w=win;win=function(){const r=_w.apply(this,arguments);setTimeout(()=>{if(MQ.ready)REC.push();else REC.sync()},3000);return r}}

{const _o=MQ.onmsg;MQ.onmsg=(t,m)=>{if(DUEL.net(t,m))return;_o(t,m)}}
